[project]
name = "product-price-viewer"
version = "0.2.0"
description = "非公開Googleスプレッドシートから商品価格を読み取り、分析する試作品"
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "google-auth>=2.35.0,<3",
    "requests>=2.32.0,<3",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
]

[tool.uv]
package = false
required-version = "==0.13.5"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
