[project]
name = "product-price-viewer"
version = "0.1.0"
description = "Excelの商品価格をブラウザで分析する試作品（開発基盤）"
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "streamlit>=1.66.1",
]

[tool.uv]
package = false
required-version = "==0.13.5"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
